<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoomArt - Monthly Sales Report</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">BoomArt</a>
            <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span></button>
            <nav class="nav" id="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="gallery.html" class="nav-link">Gallery</a>
                <a href="manage.html" class="nav-link">Manage</a>
                <a href="report.html" class="nav-link active">Sales Report</a>
                <button type="button" class="nav-link nav-logout" id="adminLogout" style="display:none;">Logout</button>
            </nav>
        </div>
    </header>

    <div id="adminLogin" class="admin-login-section">
        <div class="admin-login-card">
            <h2>Administrator Login</h2>
            <p class="admin-login-hint">View sales reports. Enter admin password.</p>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" placeholder="Admin password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <p id="adminLoginError" class="admin-login-error"></p>
        </div>
    </div>

    <main class="main" id="reportContent" style="display:none;">
        <section class="report-section">
            <div class="container">
                <h1>Monthly Sales Report</h1>
                <p class="section-desc">Track your sales performance by month.</p>

                <div class="report-filters">
                    <div class="form-group">
                        <label for="reportMonth">Select Month</label>
                        <select id="reportMonth">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reportYear">Select Year</label>
                        <select id="reportYear">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <button class="btn btn-primary" id="generateReport">Generate Report</button>
                </div>

                <div class="report-card" id="reportCard">
                    <div class="report-summary">
                        <div class="summary-item">
                            <span class="summary-label">Total Sales</span>
                            <span class="summary-value" id="totalSalesCount">0</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Revenue</span>
                            <span class="summary-value" id="totalRevenue">$0</span>
                        </div>
                    </div>
                    <div class="report-table-container">
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Items</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody id="reportTableBody">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                    <div class="report-actions">
                        <button class="btn btn-primary" id="printReport">Print Report</button>
                    </div>
                </div>

                <div class="empty-report" id="emptyReport">
                    <p>No sales data for the selected period.</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 BoomArt. Art for a Cause.</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/report.js"></script>
    <script>
        (function() {
            if (Auth.isAdmin()) {
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('reportContent').style.display = 'block';
                var logoutBtn = document.getElementById('adminLogout');
                if (logoutBtn) logoutBtn.style.display = 'block';
            } else {
                document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    var pwd = document.getElementById('adminPassword').value;
                    var err = document.getElementById('adminLoginError');
                    if (Auth.login(pwd)) {
                        document.getElementById('adminLogin').style.display = 'none';
                        document.getElementById('reportContent').style.display = 'block';
                        if (document.getElementById('adminLogout')) document.getElementById('adminLogout').style.display = 'block';
                        err.textContent = '';
                    } else {
                        err.textContent = 'Incorrect password.';
                    }
                });
            }
            document.getElementById('adminLogout') && document.getElementById('adminLogout').addEventListener('click', function() {
                Auth.logout();
                location.reload();
            });
        })();
    </script>
</body>
</html>
